[project]
name = "servewell-agent"
version = "0.1.0"
description = "ServeWell IT Support Agent Suite — agentic L1 triage POC (Streamlit + LangGraph + Ollama)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # UI
    "streamlit>=1.40",
    "plotly>=5.24",
    # Agent orchestration (MIT)
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "ollama>=0.4",
    # Retrieval: vector store + lexical (Apache-2.0)
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # Structured data layer (MIT)
    "duckdb>=1.1",
    "pandas>=2.2",
    # Schemas / config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servewell"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
